<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Aliento de fuego · Caoz</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./juego/carta-diseno.css">
<link rel="stylesheet" href="./fuego.css">
<script src="__GENERADO__/datos.js"></script>
<script src="./juego/carta-pintor.js"></script>
<script src="./juego/fx-aliento.js"></script>
<script src="./fuego.js" defer></script>
</head>
<body>
<main class="fuegoShell" aria-labelledby="fuegoTitulo">
  <header class="fuegoCabecera">
    <p class="fuegoEtiqueta">PRUEBA DE ANIMACIÓN · SIN PARTIDA</p>
    <h1 id="fuegoTitulo">Aliento de fuego verde</h1>
    <p>Thal se envuelve en fuego verde, lo escupe sobre la carta rival y la carta arde desde el impacto hasta volverse ceniza.</p>
  </header>
  <section id="mesaFuego" class="mesaFuego" aria-label="Mesa de prueba">
    <div class="filaFuego"><figure class="cartaFuego" id="objetivo" aria-label="Carta rival"></figure></div>
    <div class="lineaMesa" aria-hidden="true"></div>
    <div class="filaFuego"><figure class="cartaFuego" id="atacante" aria-label="Thal"></figure></div>
  </section>
  <div class="fuegoControles">
    <button type="button" class="fuegoBoton oro" id="atacar">Atacar con Thal</button>
    <button type="button" class="fuegoBoton" id="reiniciar">Reiniciar</button>
    <label class="fuegoOpcion"><input type="checkbox" id="lento"> Cámara lenta</label>
    <label class="fuegoOpcion">Rival <select id="rival"><option value="bartolomeo">Bartolomeo</option><option value="eric">Eric</option></select></label>
  </div>
  <p id="fuegoEstado" class="fuegoEstado" role="status" aria-live="polite">Preparando las cartas…</p>
</main>
</body>
</html>
