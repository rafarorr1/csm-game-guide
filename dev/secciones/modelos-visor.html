<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Visor de modelos</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./modelos-visor.css">
<script src="./visor-three-vendor.js"></script>
<script src="./adreida-scenario/combate.js"></script>
<script src="./arpg-three-adreida-animacion.js"></script>
<script src="./goblin-scenario/datos.js"></script>
<script src="./arpg-three-goblin.js"></script>
<script src="./kobold-scenario/datos.js"></script>
<script src="./kobold-scenario/muertes.js"></script>
<script src="./arpg-three-kobold.js"></script>
<script src="./adreida-scenario/datos.js"></script>
<script src="./adreida-brazos-rigged/datos.js"></script>
<script src="./arpg-three-adreida.js"></script>
<script src="./hacha-adreida-scenario/datos.js"></script>
<script src="./arpg-three-hacha-adreida.js"></script>
<script src="./adreida-rostro/datos.js"></script>
<script src="./arpg-three-rostro-adreida.js"></script>
<script src="./arpg-three-modelos.js"></script>
<script src="./modelos-visor.js" defer></script>
</head>
<body>
<canvas id="lienzo"></canvas>
<div class="mvPanel">
  <label>Personaje <select id="tipo"></select></label>
  <label id="opcionVariante" hidden>Variante <select id="varianteGoblin"></select></label>
  <button id="compararGoblins" type="button" aria-pressed="false" hidden>Ver las cuatro variantes</button>
  <label>Animación <select id="anim"></select></label>
  <label>Velocidad <input id="vel" type="range" min="0" max="2" step="0.05" value="1"></label>
  <label>Momento <input id="faseAnim" type="range" min="0" max="1" step="0.001" value="0"></label>
  <div class="mvBotones">
    <button id="repetir" type="button">Repetir</button>
    <button id="pausa" type="button">Pausa</button>
    <button id="girar" type="button" aria-pressed="false">Girar solo</button>
    <button id="cara" type="button">Cara</button>
    <button id="cuerpo" type="button">Cuerpo</button>
    <button id="mano" type="button">Agarre</button>
    <button id="piernas" type="button" hidden>Piernas</button>
    <button id="hacha" type="button" aria-pressed="false" hidden>Ver hacha</button>
  </div>
  <p id="datos"></p>
  <p class="mvAyuda">Arrastra para girar · rueda o pellizco para acercar</p>
</div>
<div id="fichasVariantes" class="mvFichas" hidden></div>
</body>
</html>
