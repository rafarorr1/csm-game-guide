<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <meta name="color-scheme" content="dark">
  <title>Tu cuenta del Domo · Vista de prueba</title>
  <link rel="stylesheet" href="./juego/cuenta.css">
  <link rel="stylesheet" href="./cuenta-lab.css">
  <script defer src="./juego/cuenta-modelo.js"></script>
  <script defer src="./cuenta-demo.js"></script>
  <script defer src="./juego/cuenta-ui.js"></script>
  <script defer src="./cuenta-lab.js"></script>
</head>
<body>
  <aside class="cuentaLaboratorio" aria-label="Controles de la vista de prueba">
    <div class="cuentaLabLinea"><span class="cuentaLabMarca">VISTA DE PRUEBA</span><span>Sin correos ni progreso reales.</span>
      <button id="cuentaLabAjustes" aria-expanded="false" aria-controls="cuentaLabOpciones">Escenarios</button></div>
    <div id="cuentaLabOpciones" hidden>
      <label>Probar <select id="cuentaLabEscenario"><option value="nuevo">Vincular mi progreso</option><option value="vacio">Jugador nuevo</option><option value="entrar">Entrar a mi cuenta</option><option value="conflicto">Dos progresos distintos</option></select></label>
      <label><input id="cuentaLabConexion" type="checkbox"> Simular sin conexión</label>
      <button id="cuentaLabReiniciar">Reiniciar prueba</button>
    </div>
    <div id="cuentaLabBuzon" hidden role="status"><span>Código de prueba: <strong id="cuentaLabCodigo"></strong></span><button id="cuentaLabUsar">Usar código</button></div>
  </aside>
  <main id="cuentaRaiz"></main>
  <div id="cuentaLabSalida" hidden><p>Has vuelto al menú.</p><button id="cuentaLabVolver">Volver a la cuenta</button><small>Este recorrido sólo es una demostración.</small></div>
</body>
</html>
