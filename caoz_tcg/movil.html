<!-- ==========================================================================
     LA PANTALLA DEL TELÉFONO
     Una pantalla hecha para un teléfono de pie, sobre el mismo motor que la
     de escritorio (motor.js). Aquí no hay lienzo que se encoge: el texto va a
     su tamaño, las filas se reparten el alto que haya y la mano se desliza.
     Lo que el motor necesita de una pantalla —render, ask, roll, log, los
     fx*— está abajo con los mismos nombres que en index.html.
     ========================================================================== -->
<style>
:root{
  --bg:#0d0a13; --bg2:#150f1f; --panel:#1c1429; --panel2:#241a34;
  --line:#3a2c52; --gold:#e6bb52; --gold2:#8d6f21;
  --purple:#8a5cf0; --purple2:#4a2f8a;
  --red:#e0524a; --green:#4fc07d; --blue:#4aa6ff; --ink:#f0e9f8; --dim:#a294bd;
  --c-personaje:#3d8ef5; --c-personaje-cl:#8dc2ff; --c-personaje-os:#123f7d;
  --c-hechizo:#9b5cf0;   --c-hechizo-cl:#c9a2fa;   --c-hechizo-os:#43208a;
  --c-trampa:#e0453c;    --c-trampa-cl:#ff8f86;    --c-trampa-os:#7a1912;
  --c-objeto:#e8c02f;    --c-objeto-cl:#ffe07d;    --c-objeto-os:#6f5406;
  --c-lugar:#10996a;     --c-lugar-cl:#5fd6a8;     --c-lugar-os:#064a32;
  --cw:66px; --ch:92px;            /* la carta en mesa: la pone ajustarLienzo */
  --cwm:104px; --chm:146px;        /* en la mano */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Trebuchet MS",system-ui,sans-serif;
  --arriba:env(safe-area-inset-top,0px); --abajo:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
/* El lienzo del navegador se pinta oscuro también: instalada como app, lo
   que quede fuera de #app (el borde de abajo del iPhone, la franja de la
   barra de estado) salía blanco. */
html{background:#080610}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 90% 40% at 50% -8%, rgba(120,86,190,.30), transparent 62%),
    linear-gradient(180deg,#150f22 0%,var(--bg) 55%,#080610 100%);
  color:var(--ink);font:14px/1.4 var(--sans);
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
.btn{
  background:linear-gradient(180deg,#2e2244,#1a1228);
  border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  color:var(--ink);letter-spacing:.5px;font-weight:600;font-size:14px;
  box-shadow:0 3px 0 rgba(0,0,0,.45), 0 5px 14px rgba(0,0,0,.45),
             inset 0 1px 0 rgba(255,255,255,.10)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn:disabled{opacity:.35}
.btn.gold{border-color:var(--gold2);background:linear-gradient(180deg,#6b5320,#3d2f13);
  color:#ffe6a8;font:600 15px/1.1 var(--serif);font-variant:small-caps;letter-spacing:1px;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  box-shadow:0 3px 0 #241a08, 0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,225,150,.28)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn.on{border-color:var(--gold);color:var(--gold)}

/* ============ PANTALLAS ============ */
/* El alto lo mide JS con visualViewport (--vh): 100dvh en Chrome de iPhone
   cuenta la barra de direcciones cuando está desplegada y la parte de arriba
   quedaba debajo de ella en la primera carga. --vvt es el hueco que deja la
   barra cuando el navegador la pliega. */
#app{position:fixed;inset:0;top:var(--vvt,0px);height:100%;height:100dvh;height:var(--vh,100dvh);overflow:hidden;display:flex;justify-content:center}
/* Instalada como app no hay barra de navegador que esquivar: el juego llena la
   pantalla entera, de borde a borde (la barra de estado va translúcida: con la
   sólida iOS recorta la vista y deja franjas negras arriba y abajo que no se
   pueden pintar). Fiarse de la medida del visor dejaba un borde vacío abajo. */
/* La clase la pone ajustarLienzo (navigator.standalone o el media query): con
   sólo el media query, en algún iOS no entraba y el juego seguía midiéndose
   con el visor, corto por abajo. */
/* En modo app la barra de estado es opaca (con la translúcida iOS daba una
   vista de pantalla-menos-barra pegada arriba y dejaba negros los 62 px de
   abajo, imposibles de pintar). La vista empieza bajo la barra y llega al
   borde: el juego la llena sin medir nada. */
html.app #app{top:0;bottom:0;height:auto}
/* Bajo la hora y la batería, nuestro propio fondo oscuro: sin él iOS ponía un
   velo claro para que se leyeran. Termina justo donde acaba la barra, sin
   comerse el título de debajo. */
/* Bajo la barra de estado, un bloque OPACO del color del fondo: iOS difumina
   lo que quede debajo de la hora y la batería (las cartas del fondo, el
   resplandor), y con un color plano no hay nada que difuminar. Las pantallas
   empiezan debajo de él. */
html.app #tel::before{content:"";position:absolute;left:0;right:0;top:0;height:var(--arriba);z-index:50;pointer-events:none;background:#0d0a13}
html.app .screen{padding-top:calc(var(--arriba) + 14px)}
html.app #board{padding-top:calc(var(--arriba) + 8px)}
/* En un monitor se ve como un teléfono en medio: sirve para probarla sin uno */
#tel{position:relative;width:100%;max-width:520px;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(var(--arriba) + 8px) 12px calc(var(--abajo) + 10px)}
.screen.on{display:flex}

/* ---- la identidad del logo, en los menús ---- */
#fondoMenus,.portada{--oro:#f7d488;--oro2:#d9a441;--oro3:#8a5f1e;--brasa:#ff7a18;--brasa2:#e8340c;
  --sangre:#8b1a12;--piedra:#2a1c15;--piedra2:#170f0b}
#fondoMenus{position:absolute;inset:0;display:none;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(ellipse 120% 60% at 50% 105%, rgba(232,52,12,.28), transparent 62%),
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(247,212,136,.16), transparent 60%),
    linear-gradient(180deg,#1a100b 0%,#120a08 50%,#070404 100%)}
#fondoMenus.on{display:block}
#fondoMenus::before{content:"";position:absolute;inset:0;transition:opacity 1.1s;opacity:0;
  background:radial-gradient(ellipse 120% 60% at 50% 105%, rgba(224,40,40,.45), transparent 60%),
             linear-gradient(180deg,#230b0b,#0a0404)}
#fondoMenus.rival::before{opacity:1}
.brasa{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,#ffd9a0,#ff7a18 55%,transparent 72%);
  opacity:0;animation:sube var(--dur,7s) linear var(--del,0s) infinite;
  left:var(--x,50%);filter:blur(.3px)}
@keyframes sube{0%{transform:translate(0,0) scale(1);opacity:0}8%{opacity:.9}
  100%{transform:translate(var(--dx,0px),-105dvh) scale(.35);opacity:0}}
/* Las cartas del fondo suben desde abajo y se pierden por arriba, como en
   el escritorio: antes sólo se mecían 26 px en 14 s a un 14 % de opacidad,
   y en un teléfono eso es una carta quieta. */
.cartaFondo{position:absolute;left:var(--x);top:100%;width:var(--w,110px);aspect-ratio:5/7;border-radius:9px;
  opacity:0;pointer-events:none;will-change:transform,opacity;
  animation:sube var(--dur,24s) linear var(--esp,0s) infinite}
.cartaFondo .vscard{width:100%;height:100%;border:1px solid var(--gold2);border-radius:9px;overflow:hidden;
  background:linear-gradient(178deg,#2c2143,#140e22);box-shadow:0 14px 34px rgba(0,0,0,.8)}
.cartaFondo .lface{height:100%;font-size:44px;display:grid;place-items:center}
#fondoMenus.rival .cartaFondo{filter:hue-rotate(-26deg) saturate(1.25)}
@keyframes sube{
  0%  {opacity:0;transform:translate3d(0,0,0) rotate(var(--gir0,0deg)) scale(.98)}
  12% {opacity:var(--op,.3)}
  85% {opacity:var(--op,.3)}
  100%{opacity:0;transform:translate3d(var(--dx,0px),-125vh,0) rotate(var(--gir1,0deg)) scale(1.04)}}

/* ---- menú ---- */
#menu{align-items:center;justify-content:center;gap:10px;text-align:center}
.marca{width:min(84%,330px);height:auto;aspect-ratio:16/9;object-fit:contain;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.8))}
.marcaTexto{font:800 40px/1 var(--serif);font-variant:small-caps;color:var(--oro);letter-spacing:2px}
.marcaSub{font:600 11px/1 var(--sans);letter-spacing:5px;color:var(--oro2);text-transform:uppercase}
.filete{width:min(70%,260px);height:1px;margin:4px 0 8px;
  background:linear-gradient(90deg,transparent,var(--oro2),transparent)}
.sub{font-size:12.5px;line-height:1.5;color:#c8ad86;max-width:340px}
.menucol{display:flex;flex-direction:column;gap:9px;width:min(100%,360px);margin-top:8px}
.portada .btn{border-color:rgba(217,164,65,.34);color:#f3dfc2;padding:13px 14px;font-size:14.5px;
  background:linear-gradient(180deg,rgba(74,42,22,.92),rgba(30,17,11,.94))}
.portada .btn.gold{color:#2a1a06;border-color:rgba(255,238,200,.8);
  background:linear-gradient(180deg,#ffe9b8,#d9a441 42%,#a06f1c);text-shadow:none}
.portada .btn.taller{opacity:.55;font-size:12px;padding:9px}
.foot{font-size:10px;color:#7a5c3a;letter-spacing:1px;margin-top:6px}
.foot a{color:#b08a52}
.build{font:600 9.5px/1 var(--sans);letter-spacing:1.4px;color:#7a5c3a;text-transform:uppercase}

/* ---- selección de Líder: una lista, no un carrete ---- */
#select{gap:6px}
#select .h2{font:800 18px/1.2 var(--serif);letter-spacing:1.5px;color:var(--oro);text-align:center}
.selsub{font-size:12px;color:#c8ad86;text-align:center}
.selsub b{color:var(--oro)}
.lista{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:4px 2px;
  -webkit-overflow-scrolling:touch}
.ltile{display:flex;align-items:center;gap:10px;border:1px solid rgba(217,164,65,.22);border-radius:12px;
  padding:6px 10px 6px 6px;background:linear-gradient(180deg,rgba(44,33,67,.6),rgba(20,14,34,.7));
  transition:border-color .15s, transform .15s}
.ltile.sel{border-color:var(--oro);background:linear-gradient(180deg,rgba(90,60,30,.55),rgba(30,17,11,.9));
  box-shadow:0 0 0 1px rgba(247,212,136,.3), 0 8px 22px rgba(0,0,0,.6)}
.ltile .lface{width:58px;height:58px;border-radius:10px;flex:0 0 auto;font-size:30px;
  display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(138,92,240,.34),transparent 70%),#1b1329}
.ltile .lname{font:700 15px/1.1 var(--serif);font-variant:small-caps;color:#fdf6e6}
.ltile .larch{font:700 9px/1.3 var(--sans);color:var(--oro2);text-transform:uppercase;letter-spacing:1.2px}
.ltile .lhab{font-size:11px;color:#b3a6cd;margin-top:2px}
.ltile .lhab b{color:var(--oro)}
.ltile .lmarca{margin-left:auto;font-size:18px;color:var(--oro);opacity:0}
.ltile.sel .lmarca{opacity:1}
.fichaLider{border:1px solid rgba(217,164,65,.3);border-radius:12px;padding:9px 11px;
  background:rgba(20,12,8,.75);font-size:12px;line-height:1.45;color:#d9c8ad;max-height:32dvh;overflow-y:auto}
.fichaLider .fn{font:700 15px/1.2 var(--serif);color:var(--oro)}
.fichaLider .fn span{font-size:11.5px;color:#a68a63;font-weight:400}
.fichaLider .fl{margin-top:5px}
.fichaLider b{color:#fff1d6}
.fichaLider .fm{margin-top:6px;font-size:11px;color:#a68a63}
.selbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:4px}
.selbtns .btn{flex:1 1 auto;padding:11px 8px;font-size:13.5px}

/* ---- guías ---- */
#guide{padding-left:0;padding-right:0}
.gbar{display:flex;align-items:center;gap:8px;padding:0 10px 6px;flex:0 0 auto}
.gtabs{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.gtab{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);
  border:1px solid rgba(217,164,65,.25);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;color:#b79c7f}
.gtab.on{border-color:var(--oro);color:var(--oro)}
.gbody{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 30px;-webkit-overflow-scrolling:touch;
  user-select:text;-webkit-user-select:text}
.ghead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.ghead .gart{font-size:44px;line-height:1}
.ghead h2{font-size:19px;color:var(--oro);line-height:1.15}
.gsub{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--oro2);font-weight:800}
.glema{font-size:13px;color:#d9cdee;font-style:italic;margin-top:5px}
.gmeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:#a68a63}
.gmeta b{color:var(--ink)}
.gsec{margin-bottom:18px}
.gsec h3{font-size:14.5px;color:var(--oro);margin-bottom:5px}
.gsec p,.gsec li{font-size:13.2px;line-height:1.55;color:#ddd0bd}
.gsec b{color:#fff4e2}
.gsec ul{margin-left:18px}
.gsec.destacado{background:linear-gradient(180deg,rgba(255,122,24,.13),rgba(0,0,0,.24));
  border:1px solid rgba(217,164,65,.34);border-left:3px solid var(--brasa);border-radius:10px;padding:10px 12px}
.gcards{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 10px;-webkit-overflow-scrolling:touch}
.gcards .card{--cw:96px;--ch:134px}
.gcount{position:absolute;top:25px;left:3px;z-index:6;font-size:11px;font-weight:900;color:var(--gold);
  background:rgba(8,4,14,.9);border:1px solid var(--gold2);border-radius:6px;padding:0 5px}
.gturnos{display:flex;flex-direction:column;gap:8px}
.gturno{display:flex;gap:9px;align-items:flex-start}
.gturno .gt{flex:0 0 50px;text-align:center;font-weight:900;font-size:11.5px;color:var(--oro);
  background:rgba(247,212,136,.12);border:1px solid rgba(217,164,65,.5);border-radius:8px;padding:4px 0}
.gturno p{flex:1}
.gvs{width:100%;border-collapse:collapse;font-size:12px}
.gvs td{border-bottom:1px solid rgba(217,164,65,.2);padding:6px 5px;vertical-align:top;color:#d4c3ad}
.gv{font-weight:800;white-space:nowrap;color:var(--dim)}
.gv.bien{color:var(--green)} .gv.mal{color:var(--red)}
.gplan{color:#c3ab8d}

/* ============ LA MESA ============ */
#board{padding:calc(var(--arriba) + 4px) 5px calc(var(--abajo) + 4px);gap:3px}
#field{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:2px;
  position:relative;border-radius:12px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 50%, rgba(120,86,190,.16), transparent 70%),
    linear-gradient(180deg,rgba(28,20,42,.5),rgba(14,9,22,.6))}
.zona{display:flex;align-items:center;gap:4px;padding:0 3px}
.zona .zlabel{position:absolute;left:8px;font:600 8px/1 var(--sans);letter-spacing:2px;color:#5c507a}
.row{display:flex;justify-content:center;align-items:center;gap:5px;min-height:var(--ch);flex:1;padding:3px 2px}
.row.traps{min-height:30px;gap:5px;padding:1px}
.pilas{display:flex;gap:4px;flex:0 0 auto}
#efectos{display:flex;gap:6px;margin-right:4px} #efectos[hidden]{display:none}
.midrow{display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px;padding:2px 6px;
  border-top:1px dashed rgba(58,44,82,.7);border-bottom:1px dashed rgba(58,44,82,.7);flex-wrap:wrap}
.midrow .btn.sm{font-size:11px;padding:4px 8px}

/* barras */
.bar{display:flex;align-items:center;gap:4px;padding:3px 4px;flex-wrap:nowrap;
  background:linear-gradient(180deg,rgba(20,13,32,.92),rgba(10,6,17,.80));
  border:1px solid var(--line);border-radius:10px}
.bar.sinborde{border:none;background:none;padding:0;flex:1;min-width:0;flex-wrap:wrap;gap:3px}
.bar .who{display:none}
#barMe .stat[title="Cartas en mano"]{display:none}
.stat{display:flex;align-items:center;gap:3px;background:linear-gradient(180deg,#241a34,#160f24);
  border:1px solid var(--line);border-radius:20px;padding:2px 6px;font-size:10px;font-weight:700;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.stat i{font-style:normal;font:800 13.5px/1 var(--serif);font-variant-numeric:tabular-nums;text-shadow:0 2px 4px #000}
.stat.alma{color:var(--red);border-color:rgba(224,82,74,.55)}
.stat.pd{color:var(--blue);border-color:rgba(74,166,255,.5)}
.stat.key{color:var(--gold);border-color:rgba(230,187,82,.5)}
.stat.gr{color:var(--green)}
.stat.pila{color:var(--dim)}
.spacer{flex:1}
.turnpill{background:var(--panel2);border:1px solid var(--gold2);border-radius:20px;padding:2px 9px;
  color:var(--gold);font-weight:700;font-size:10.5px;animation:late 1.6s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 12px rgba(230,187,82,.5)}}
.netchip{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);white-space:nowrap}
.netchip b{color:var(--gold);letter-spacing:1px}
.diariobtn{border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:11px}

/* la ficha de Líder, pequeña, en la barra */
.lider{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;
  padding:2px 8px 2px 2px;background:linear-gradient(180deg,#2c2143,#140e22);position:relative;
  transition:box-shadow .2s, border-color .2s}
.lider .lrostro{width:32px;height:32px;border-radius:8px;overflow:hidden;position:relative;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;background:#1b1329}
.lider .lrostro img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:var(--ex,50%) var(--ey,50%);transform:scale(var(--ez,1));transform-origin:var(--ex,50%) var(--ey,50%)}
.lider .ln{font:700 12px/1.05 var(--serif);font-variant:small-caps;color:#fdf6e6;white-space:nowrap}
.lider .lh{font-size:9px;color:var(--dim);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.lider .lh b{color:var(--gold)}
.lider.usable{border-color:var(--gold);box-shadow:0 0 0 1px rgba(230,187,82,.4),0 0 14px rgba(230,187,82,.4);
  animation:late 1.6s ease-in-out infinite}
.lider.usable .lh{color:#ffe6a8}
.lider.spent{opacity:.7}
.lider.tgt{border-color:var(--red);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red),0 0 14px rgba(224,82,74,.6);
  animation:pulse 1s infinite}

/* ---- mano ---- */
#handzone{flex:0 0 auto;position:relative;
  background:
    radial-gradient(ellipse 62% 100% at 50% 100%, rgba(236,196,110,.08), transparent 72%),
    linear-gradient(180deg, transparent, rgba(5,3,10,.85) 40%)}
#hand{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:16px 10px 8px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:calc(var(--chm) + 24px)}
#hand::-webkit-scrollbar{display:none}
#hand > :first-child{margin-left:auto} #hand > :last-child{margin-right:auto}
#hand .card{width:var(--cwm);height:var(--chm);scroll-snap-align:center;flex:0 0 auto;
  transition:transform .2s cubic-bezier(.22,.61,.36,1), box-shadow .2s, opacity .2s, filter .2s}
#hand .card.tocada{transform:translateY(-12px) scale(1.04);z-index:5;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold),0 12px 26px rgba(0,0,0,.8)}
#hand.mirando .card.unplayable{opacity:.95;filter:none}
/* el aviso de la carta tocada: qué es y cómo jugarla */
#jugarPill{position:absolute;left:10px;right:10px;top:-10px;z-index:8;
  display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  background:rgba(14,8,22,.96);border:1px solid var(--gold2);border-radius:14px;padding:6px 10px;
  font-size:12px;color:#e6dcf5;box-shadow:0 8px 24px #000}
#jugarPill.on{display:flex}
#jugarPill b{color:var(--gold)}
#jugarPill .btn{padding:5px 12px;font-size:12px}
#jugarPill .porque{flex:1 1 100%;text-align:center;color:#ff9d94;font-size:11px;line-height:1.3}
#controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
#controls .btn{padding:7px 9px;font-size:12px}
#controls .btn.gold{font-size:13px;padding:7px 12px}
/* mensajes sin leer: un punto en el botón del registro hasta que se abre la hoja */
#controls .btn.aviso{position:relative;border-color:var(--gold)}
#controls .btn.aviso::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--red);color:#fff;font:800 10px/17px var(--sans);text-align:center;box-shadow:0 2px 6px #000}
#reloj{font:800 12px/1 var(--serif);color:var(--gold);padding:0 4px}
#reloj.poco{color:var(--red)}
#reloj[hidden]{display:none}

/* ============ CARTAS (el mismo diseño que en el escritorio) ============ */
.card{
  width:var(--cw);height:var(--ch);border-radius:9px;position:relative;flex:0 0 auto;
  background:linear-gradient(178deg,#2b2040 0%,#1b1329 42%,#150e22 100%);
  border:1px solid var(--line);padding:0;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 2px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07)}
.card .art{position:relative;height:44%;flex:0 0 auto;display:grid;place-items:center;
  font-size:2.6em;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.85));
  background:radial-gradient(ellipse 100% 80% at 50% 25%,color-mix(in srgb,var(--tipo,#5a4a7a) 42%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35));overflow:hidden}
.card .art::after{content:"";position:absolute;inset:auto 0 0 0;height:46%;
  background:linear-gradient(180deg,transparent,#1b1329 92%)}
.card .top{position:absolute;inset:0;z-index:3;pointer-events:none;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:56%;z-index:3;
  font:700 11.5px/1.14 var(--serif);font-variant:small-caps;letter-spacing:.4px;
  padding:3px 7px 4px 8px;color:#fdf6e6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 2px 5px rgba(0,0,0,.95), 0 0 14px rgba(0,0,0,.7)}
.card .cost{position:absolute;top:5px;left:5px;z-index:4;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font:800 13px/1 var(--serif);
  background:radial-gradient(circle at 35% 28%,#7fc4ff,#1f5fa8);color:#fff;border:1px solid #9fd4ff;
  box-shadow:0 2px 6px rgba(0,0,0,.7)}
.card .tribe{font:600 7.5px/1.1 var(--sans);color:#9c8fbb;text-align:center;letter-spacing:1.2px;
  text-transform:uppercase;padding:4px 5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .txt{font:9px/1.3 var(--sans);color:#cfc3e4;flex:1;overflow:hidden;padding:0 7px;text-align:center}
.card .txt b{color:var(--gold);font-weight:700}
.card .stats{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding:0 5px 5px}
.card .atk,.card .hp{font:800 16px/1 var(--serif);text-shadow:0 2px 4px #000;min-width:30px;text-align:center;
  border-radius:7px;padding:3px 6px;border:1px solid transparent;
  box-shadow:0 2px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18)}
.card .atk{color:#ffe0b0;background:linear-gradient(180deg,#a8571a,#6d3510);border-color:rgba(255,190,120,.45)}
.card .hp{color:#ffc8c0;background:linear-gradient(180deg,#a82a2a,#6d1414);border-color:rgba(255,140,130,.45)}
.card .rar{position:absolute;top:5px;right:6px;z-index:4;font-size:10px;color:var(--gold);text-shadow:0 1px 3px #000}
.card.t-personaje{--tipo:var(--c-personaje);--tipo-cl:var(--c-personaje-cl);--tipo-os:var(--c-personaje-os)}
.card.t-hechizo  {--tipo:var(--c-hechizo);  --tipo-cl:var(--c-hechizo-cl);  --tipo-os:var(--c-hechizo-os)}
.card.t-trampa   {--tipo:var(--c-trampa);   --tipo-cl:var(--c-trampa-cl);   --tipo-os:var(--c-trampa-os)}
.card.t-objeto   {--tipo:var(--c-objeto);   --tipo-cl:var(--c-objeto-cl);   --tipo-os:var(--c-objeto-os)}
.card.t-lugar    {--tipo:var(--c-lugar);    --tipo-cl:var(--c-lugar-cl);    --tipo-os:var(--c-lugar-os)}
.card[class*="t-"]{border:1px solid var(--tipo);
  box-shadow:0 2px 6px rgba(0,0,0,.55), inset 0 0 0 1px color-mix(in srgb,var(--tipo-cl) 26%, transparent)}
.card[class*="t-"] .cost{background:radial-gradient(circle at 35% 30%,var(--tipo-cl),var(--tipo-os));
  border-color:var(--tipo-cl);box-shadow:0 0 6px color-mix(in srgb,var(--tipo) 55%,transparent)}
.card .cost.rebajado{box-shadow:0 0 0 2px #0d0a13,0 0 0 4px #6cf09a,0 0 10px rgba(108,240,154,.6)}
.card.playable{}
body.tut-on .card.playable{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--green),0 0 15px rgba(79,192,125,.4)}
.card.locked{opacity:.3;filter:grayscale(.9);box-shadow:none}
.card.unplayable{opacity:.45;filter:grayscale(.72) brightness(.62)}
.card.tgt{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red),0 0 17px rgba(224,82,74,.55);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--red),0 0 26px rgba(224,82,74,.85)}}
.card.selected{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(230,187,82,.6);transform:translateY(-4px) scale(1.05);z-index:5}
.foil{display:none}
/* el foil de las raras: un brillo fijo, sin seguir al dedo */
.card .foil, .big .foil{display:block;position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 45%,rgba(180,220,255,.18) 50%,rgba(255,220,160,.12) 55%,transparent 70%);
  mix-blend-mode:overlay}
.card.unit .cajon{display:none}     /* en el teléfono lo cuenta la ficha */
/* el acomodo: el dibujo ocupa la carta y el pie con velo abajo */
.card.acomodo{font-size:calc(var(--cw) * 0.105)}
#hand .card.acomodo{font-size:calc(var(--cwm) * 0.095)}
.card.acomodo.conarte .art{display:none}
.marcoDibujo{position:absolute;inset:0;z-index:0;overflow:hidden;border-radius:8px;pointer-events:none}
.dibujo{position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:cover;
  object-position:var(--ex,50%) var(--ey,50%);transform:scale(var(--ez,1));transform-origin:var(--ex,50%) var(--ey,50%);
  pointer-events:none;display:block}
.card.acomodo.conarte::before{content:"";position:absolute;inset:0;z-index:1;border-radius:8px;pointer-events:none;
  background:linear-gradient(180deg, rgba(8,6,14,0) 38%, rgba(8,6,14,.55) 66%, rgba(8,6,14,.92) 100%)}
.card.acomodo.conarte > *:not(.marcoDibujo){position:relative;z-index:2}
.card.acomodo.sinarte .art{position:absolute;inset:0;z-index:0;height:auto;display:grid;place-items:center;
  font-size:3.1em;padding:0 0 22% 0;border-radius:8px;overflow:hidden;
  background:radial-gradient(ellipse 115% 72% at 50% 34%,color-mix(in srgb,var(--tipo,#5a4a7a) 40%, transparent), transparent 74%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.42))}
.card.acomodo.sinarte .art::after{content:"";position:absolute;inset:auto 0 0 0;height:58%;
  background:linear-gradient(180deg,transparent,rgba(8,6,14,.92))}
.card.acomodo .top{position:relative;z-index:2;align-items:center}
.card.acomodo .pieCarta .nm{position:static;inset:auto;font-size:1.18em;line-height:1.06;padding:0 0 .12em;margin:0;
  background:none;border:none;-webkit-line-clamp:2;color:#fdf6e6;text-align:center;
  text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.9)}
.card.acomodo .pieCarta .tribe,.card.acomodo .pieCarta .txt{padding-left:0;padding-right:0;text-align:center}
.card.acomodo .cost{width:2em;height:2em;font-size:.95em;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.7)}
.card.acomodo .rar{font-size:.9em}
.card.acomodo .pieCarta{margin:auto -5px -5px;padding:1.05em .5em .62em;position:relative;z-index:2;
  display:flex;flex-direction:column;gap:0;
  background:linear-gradient(180deg, rgba(8,6,14,0) 0%, rgba(8,6,14,.72) 30%, rgba(8,6,14,.93) 58%, rgba(8,6,14,.97) 100%)}
.card.acomodo .pieCarta .tribe{font-size:.68em;margin:0 0 .14em;line-height:1.1;text-shadow:0 1px 2px #000}
.card.acomodo .pieCarta .txt{font-size:.84em;line-height:1.16;flex:none;color:#e6dcf5;text-shadow:0 1px 2px #000;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.acomodo .pieCarta .stats{margin-top:.35em;padding-top:0}
.card.acomodo .pieCarta .atk,.card.acomodo .pieCarta .hp{font-size:1.25em;min-width:2em;padding:.05em .35em}
/* en mesa la carta es chica: el texto de reglas no cabe y lo cuenta la ficha */
.row .card .txt{display:none}
.row .card.acomodo .pieCarta{padding-top:.6em}
.row .card.acomodo .pieCarta .nm{font-size:1.25em}
.unit{overflow:visible;box-shadow:0 3px 6px rgba(0,0,0,.5), 0 8px 16px rgba(0,0,0,.5)}
.unit.sick{filter:saturate(.55) brightness(.82)}
.card.unit.gastada{filter:saturate(.42) brightness(.66);opacity:.86}
.card.unit.gastada::before{content:"✓";position:absolute;top:-7px;right:-5px;z-index:5;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;background:linear-gradient(180deg,#4a4260,#2a2438);color:#cfc3e4;
  font:700 10px/1 var(--sans);border:1px solid rgba(255,255,255,.18)}
@keyframes readyGlow{
  0%,100%{box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(79,192,125,.55),0 0 12px rgba(79,192,125,.35)}
  50%{box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(79,192,125,.95),0 0 22px rgba(79,192,125,.7)}}
.card.unit.ready{animation:readyGlow 1.9s ease-in-out infinite}
.unit.ready::after{content:"⚔";position:absolute;top:-8px;right:-6px;width:18px;height:18px;border-radius:50%;
  background:var(--green);color:#06240f;font-size:11px;font-weight:900;display:grid;place-items:center;
  box-shadow:0 2px 8px #000;pointer-events:none;z-index:3}
.card.unit.tgt{border-color:var(--red);animation:pulse 1s infinite}
.card.unit.tgt::after{display:none}
.unit .keys{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;position:relative;z-index:2}
.kw{font-size:7px;padding:0 3px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.kw.pro{color:#ffcf8a;border-color:#7a5a20} .kw.vue{color:#9fd4ff;border-color:#2f5f8a}
.kw.sig{color:#c9a6ff;border-color:#5a3f8a} .kw.bad{color:var(--red);border-color:#7a2a26}
.kw.good{color:var(--green);border-color:#2a7a4a}
.kw.hab{color:#e8d9a0;border-color:#6b5a2a;background:#2a2213;font-style:italic}
.row .card .keys .kw.hab{display:none}   /* en mesa sólo las palabras clave del juego */
.eq{position:absolute;top:24px;right:2px;display:flex;flex-direction:column;gap:1px;z-index:3}
.eq span{font-size:11px;filter:drop-shadow(0 1px 2px #000)}
.card.infectado{border-color:#5fd45f!important;background:linear-gradient(175deg,#1f3a1f,#0f2410);
  box-shadow:0 0 0 1px rgba(95,212,95,.5),0 0 14px rgba(95,212,95,.35)}
.card.infectado::after{content:'☣';position:absolute;bottom:3px;left:4px;font-size:11px;color:#7cf07c;z-index:4}
.trapback{width:44px;height:28px;border-radius:6px;border:1px solid var(--c-trampa);
  background:repeating-linear-gradient(45deg,#2a1030,#2a1030 5px,#3a1a44 5px,#3a1a44 10px);
  display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.trapback.mine{border-style:dashed}
.trapback .cajon{display:none}
.placecard{display:flex;align-items:center;gap:7px;background:linear-gradient(90deg,#2b2a14,#1a1a10);
  border:1px solid #6a6a2a;border-radius:9px;padding:3px 9px;max-width:100%;min-width:0}
.placecard .pi{font-size:18px}
.placecard .pn{font-weight:800;color:#d9dd7a;font-size:11px}
.placecard .pt{font-size:9px;color:#b6b892;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.placecard.tgt{box-shadow:0 0 0 2px var(--red);animation:pulse 1s infinite}
.efecto{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--panel)}
.efecto.mio{border-color:var(--gold2)}
.efecto .ei{font-size:15px}
.efecto i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font:800 10px/1 var(--serif);color:var(--gold);
  background:#0d0a13;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;border:1px solid var(--gold2)}
.efecto .cajon{display:none}

/* ============ HOJAS: ficha, registro ============ */
.hoja{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;bottom:0;z-index:260;display:none;flex-direction:column;
  max-height:min(86dvh, 720px);padding:8px 10px calc(var(--abajo) + 10px);
  background:linear-gradient(180deg,#221839,#140e22);border-top:1px solid var(--gold2);border-radius:18px 18px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.75);animation:subeHoja .26s cubic-bezier(.22,.61,.36,1)}
.hoja.on{display:flex}
@keyframes subeHoja{from{transform:translateX(-50%) translateY(40px);opacity:0}}
.hoja .asa{width:44px;height:4px;border-radius:2px;background:#4a3d66;margin:0 auto 8px}
.hoja .hcuerpo{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hoja .hbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#velo{position:fixed;inset:0;z-index:255;background:rgba(6,4,10,.55);display:none}
#velo.on{display:block}
#inspect .hcuerpo{display:flex;justify-content:center}
.big{width:min(300px, 100%);font-size:14px;
  background:linear-gradient(178deg,#33254e 0%,#1e1533 42%,#140e22 100%);
  border:1px solid var(--tipo,var(--gold));border-radius:15px;padding:0;overflow:hidden;
  box-shadow:0 26px 64px rgba(0,0,0,.85), 0 0 0 1px rgba(230,187,82,.18);
  display:flex;flex-direction:column;position:relative;flex:0 0 auto}
.big.t-personaje{--tipo:var(--c-personaje)} .big.t-hechizo{--tipo:var(--c-hechizo)} .big.t-trampa{--tipo:var(--c-trampa)}
.big.t-objeto{--tipo:var(--c-objeto)} .big.t-lugar{--tipo:var(--c-lugar)}
.big .art{position:relative;height:170px;flex:0 0 auto;font-size:70px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse 100% 80% at 50% 25%,color-mix(in srgb,var(--tipo,#5a4a7a) 42%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35))}
.big .art::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(180deg,transparent,#1b1329 92%)}
.big .art.conarte{font-size:0}
.big .top{position:absolute;inset:0 0 auto 0;height:170px;z-index:3;pointer-events:none}
.big .cost{position:absolute;top:9px;left:9px;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;
  font:800 16px/1 var(--serif);background:radial-gradient(circle at 35% 30%,var(--tipo-cl,#7fc4ff),var(--tipo-os,#1f5fa8));
  color:#fff;border:1px solid rgba(255,255,255,.5)}
.big .nm{position:absolute;left:0;right:0;bottom:0;font:700 18px/1.15 var(--serif);font-variant:small-caps;letter-spacing:.7px;
  color:#fdf6e6;padding:5px 11px 6px;background:linear-gradient(90deg,rgba(8,5,14,.94),rgba(8,5,14,.66) 82%,transparent)}
.big .tribe{font:600 10px/1.2 var(--sans);letter-spacing:2px;padding:8px 12px 5px;color:#a596c4;text-transform:uppercase}
.big .txt{font:13.5px/1.55 var(--sans);color:#e6dcf5;padding:0 12px 10px;text-align:left}
.big .txt b{color:var(--gold);font-weight:700}
.big .stats{display:flex;padding:0 12px 12px;gap:8px}
.big .atk,.big .hp{font:800 21px/1 var(--serif);min-width:44px;text-align:center;border-radius:8px;padding:5px 9px;
  border:1px solid transparent;text-shadow:0 2px 4px #000}
.big .atk{color:#ffe0b0;background:linear-gradient(180deg,#a8571a,#6d3510);border-color:rgba(255,190,120,.45)}
.big .hp{color:#ffc8c0;background:linear-gradient(180deg,#a82a2a,#6d1414);border-color:rgba(255,140,130,.45)}
.big .keys{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 9px}
.big .kw{font-size:10px;padding:1px 6px}
.big .bigsep{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:2px 12px 9px}
.big .bigrow{font:700 12.5px/1.3 var(--serif);color:var(--gold);padding:0 12px 3px}
.big .bigbase{font:11px/1.3 var(--sans);color:#9c8fbb;padding:0 12px 9px;font-style:italic}
.big .mods{font-size:11.5px;color:#a99ac6;padding:0 12px 8px;line-height:1.45}
.big .mods b{color:#fdf6e6}
.big .porque{font-size:12px;color:#ff9d94;font-weight:600;padding:0 12px 10px}
.big .marcoDibujo{position:absolute;inset:0;z-index:0}
.big .marcoDibujo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:var(--ex,50%) var(--ey,50%);transform:scale(var(--ez,1));transform-origin:var(--ex,50%) var(--ey,50%)}
.panelttl{font:600 9.5px/1 var(--sans);letter-spacing:2.4px;color:#7a6ba0;text-transform:uppercase;padding:2px 2px 6px}
#log{font-size:12.5px;line-height:1.45;color:#cfc3e4;user-select:text;-webkit-user-select:text}
#log > div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#log .sys{color:var(--dim)} #log .dmg{color:#ff9d94} #log .heal{color:#8be7b4} #log .roll{color:#ffd9a0}
#log b{color:var(--gold)}
#chatzona{margin-top:8px;display:flex;flex-direction:column;gap:6px}
#chatzona[hidden]{display:none}
#chat{max-height:26dvh;overflow:auto;font-size:12.5px}
#chat .msg{margin-bottom:4px;word-break:break-word}
#chat .msg .de{font-weight:800} #chat .msg.mio .de{color:var(--gold)} #chat .msg.suyo .de{color:var(--blue)}
#chat .vacio{color:#6a5d8a;font-style:italic}
#chatform{display:flex;gap:6px}
#chatinput{flex:1;min-width:0;background:rgba(8,5,15,.9);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:9px 10px;font:inherit;font-size:16px}
/* la última línea del registro, asomando sobre la mano */
#ticker{position:absolute;left:8px;right:8px;top:1px;z-index:6;pointer-events:none;text-align:center;
  font-size:11.5px;color:#d9cdee;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .4s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker.on{opacity:1}
#ticker b{color:var(--gold)}

/* ============ OVERLAY, DADO, AVISOS ============ */
.ov{position:fixed;inset:0;background:rgba(6,4,10,.84);display:none;align-items:center;justify-content:center;
  z-index:200;padding:14px;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold2);
  border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:calc(100dvh - 40px);overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7);-webkit-overflow-scrolling:touch}
.panel h3{color:var(--gold);font-size:18px;margin-bottom:8px;line-height:1.25}
.panel p{color:var(--dim);margin-bottom:10px;font-size:13.5px;line-height:1.5}

'use strict';
/* ==========================================================================
   LA PANTALLA DEL TELÉFONO — lo que el motor espera de una pantalla, hecho
   para un teléfono de pie. Mismos nombres que en index.html: render, ask,
   pickCard, roll → rollDice, log, toast, los fx*, el tutorial, la red.
   ========================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const BUILD = {n:156, fecha:'2026-09-05'};
const nap = ms => ((G&&G.fast)||document.hidden) ? Promise.resolve() : sleep(ms);
const FXON = ()=> G && !G.fast && !G.silent && !document.hidden;
const FX_SUAVE = ()=> matchMedia('(prefers-reduced-motion: reduce)').matches;
const esMovil = () => true;
/* El navegador sólo deja vibrar después de un toque real; antes de eso lo
   anota como error en la consola. Se recuerda el primer toque. */

/* ---------- texto que se encoge para caber (igual que en escritorio) ---------- */
function encajarAncho(nodo, minFactor){
  if(!nodo) return;
  nodo.style.fontSize='';
  const ancho=nodo.clientWidth; if(!ancho) return;
  const sobra=nodo.scrollWidth/ancho; if(sobra<=1.001) return;
  const base=parseFloat(getComputedStyle(nodo).fontSize), min=base*(minFactor||0.72);
  nodo.style.fontSize=Math.max(min, base/sobra*0.97).toFixed(2)+'px';
  if(nodo.scrollWidth>nodo.clientWidth+1){ nodo.style.whiteSpace='normal'; nodo.style.lineHeight='1.05'; nodo.style.textOverflow='clip'; }
}
function encajarAlto(nodo, minFactor){
  if(!nodo) return;
  nodo.style.fontSize=''; nodo.style.webkitLineClamp='';
  const hueco=nodo.clientHeight; if(!hueco) return;
  nodo.style.webkitLineClamp='unset';
  if(nodo.scrollHeight<=hueco+1){ nodo.style.webkitLineClamp=''; return; }
  const base=parseFloat(getComputedStyle(nodo).fontSize), min=base*(minFactor||0.70);
  let t=Math.max(min, base*(hueco/nodo.scrollHeight));
  nodo.style.fontSize=t.toFixed(2)+'px';
  for(let i=0;i<6 && nodo.scrollHeight>hueco+1 && t>min+0.01;i++){ t=Math.max(min,t*0.95); nodo.style.fontSize=t.toFixed(2)+'px'; }
  const linea=parseFloat(getComputedStyle(nodo).lineHeight)||t*1.16;
  nodo.style.webkitLineClamp=String(Math.max(1,Math.floor(hueco/linea)));
}
function encajarTextos(raiz){
  const r=raiz||document;
  r.querySelectorAll('.card .tribe').forEach(t=>encajarAncho(t,0.68));
  r.querySelectorAll('#hand .card .txt, .gallery .card .txt, .gcards .card .txt').forEach(t=>encajarAlto(t,0.70));
}

  const caja=document.createElement('div'); caja.className='marcoDibujo';

  nodo.style.setProperty('--ez', (enc.z/100).toFixed(3));

}

/* ---------- el reparto del alto: las cartas crecen hasta llenar lo que hay ---------- */
const altoVisible = () => (window.visualViewport ? visualViewport.height : innerHeight);
const anchoVisible = () => Math.min(window.visualViewport ? visualViewport.width : innerWidth, 520);
function ajustarLienzo(){
  const app = navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  document.documentElement.classList.toggle('app', !!app);
  // en modo app, de pie, manda la pantalla entera (screen.height no gira en iOS: sólo de pie)
  const dePie = innerHeight > innerWidth;
  const W=anchoVisible(), H=app ? Math.max(altoVisible(), innerHeight, dePie ? (screen.height||0) : 0) : altoVisible();
  const r=document.documentElement.style;
  r.setProperty('--vh', H+'px');
  r.setProperty('--vvt', (window.visualViewport ? Math.round(visualViewport.offsetTop) : 0)+'px');
  // cinco Personajes por fila, con sus huecos, y que las dos filas quepan con
  // todo lo demás (barras, trampas, medio, mano) en el alto que hay
  const porAncho=Math.floor((W-10-6-4*5)/5);
  const fijo= 44+44 + 30+30 + 30 + 8 + (H<720 ? 160 : 176) + 40 + 10;
  const porAlto=Math.floor((H-fijo)/2/1.4);
  const cw=Math.max(58, Math.min(porAncho, porAlto, 96));
  r.setProperty('--cw', cw+'px'); r.setProperty('--ch', Math.round(cw*1.4)+'px');
  // y lo que sobre se lo lleva la mano, que es lo que se lee
  const ch=Math.round(cw*1.4);
  const sobra=H-(46+46+30+30+30+2*ch+40+30);
  const cwm=Math.max(92, Math.min(128, Math.floor((sobra-24)/1.4)));
  r.setProperty('--cwm', cwm+'px'); r.setProperty('--chm', Math.round(cwm*1.4)+'px');
}
addEventListener('resize', ajustarLienzo);
addEventListener('orientationchange', ajustarLienzo);
if(window.visualViewport){ visualViewport.addEventListener('resize', ajustarLienzo); visualViewport.addEventListener('scroll', ajustarLienzo); }
addEventListener('pageshow', ajustarLienzo);
addEventListener('load', ajustarLienzo);
// la barra del navegador se asienta después del primer pintado: se vuelve a medir
[150, 600, 1500].forEach(t=>setTimeout(ajustarLienzo, t));
ajustarLienzo();

/* ---------- pulsación larga: el "hover" del teléfono ---------- */
function pulsacionLarga(nodo, fn){
  let t=null, x0=0, y0=0;
  const cancela=()=>{ if(t){ clearTimeout(t); t=null; } };
  nodo.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    x0=e.clientX; y0=e.clientY;
    cancela();
    t=setTimeout(()=>{ t=null; nodo.dataset.larga='1'; fn(e); }, 380);
  });
  nodo.addEventListener('pointermove', e=>{ if(t && Math.hypot(e.clientX-x0,e.clientY-y0)>10) cancela(); });
  nodo.addEventListener('pointerup', cancela);
  nodo.addEventListener('pointercancel', cancela);
  nodo.addEventListener('pointerleave', cancela);
  // tras una pulsación larga el toque que la suelta no cuenta como toque
  nodo.addEventListener('click', e=>{ if(nodo.dataset.larga){ delete nodo.dataset.larga; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  nodo.addEventListener('contextmenu', e=>e.preventDefault());
}

function buildSelect(){
  const ids=Object.keys(LEADERS), mio=SEL_PASO==='yo';
  if(!SELP) SELP=ids[0];
  if(!mio && !SELF) SELF=ids.find(x=>x!==SELP)||ids[0];
  const elegido=mio?SELP:SELF;
  $('#selTitle').textContent=mio?'ELIGE TU PROTAGONISTA':'ELIGE A TU RIVAL';
  $('#selSub').innerHTML=mio?'Cada Líder trae su mazo de 40 cartas.':`Llevas a <b>${LEADERS[SELP].n}</b>. ¿Contra quién?`;
  $('#selGo').textContent=mio?'Elegir →':'Entrar al Domo →';
  $('#selBack').textContent=mio?'← Volver':'← Cambiar';
  $('#fondoMenus').classList.toggle('rival', !mio);
  const lista=$('#leaderList');
  if(lista.children.length!==ids.length){
    lista.innerHTML='';
    ids.forEach(id=>{ const L=LEADERS[id], D=DECKS[id];
      const d=el('div','ltile',`<div class="lface">${L.art}</div>
        <div><div class="lname">${L.n}</div><div class="larch">${D.d}</div>
          <div class="lhab">${L.habName} · <b>${L.habCost} PD</b> · ${estrellas(GUIAS[id].dif)}</div></div>

      d.dataset.lid=id; ilustrarLider(d,id);
      d.onclick=()=>{ if(SEL_PASO==='yo') SELP=id; else SELF=id; buildSelect(); };
      lista.appendChild(d); });
  }
  [...lista.children].forEach(d=>d.classList.toggle('sel', d.dataset.lid===elegido));
  const L=LEADERS[elegido], D=DECKS[elegido];
  $('#fichaLider').innerHTML=`<div class="fn">${L.n} <span>— ${L.ep}</span></div>
    <div class="fl">${L.pasiva}</div><div class="fl">${L.hab}</div>
    <div class="fm">Mazo <b>“${D.n}”</b> · 40 cartas · dificultad ${estrellas(GUIAS[elegido].dif)}</div>`;
  const sel=lista.querySelector('.sel'); if(sel) sel.scrollIntoView({block:'nearest'});
}

function showGallery(){
  const p=$('#ovPanel');
  const types=['todas','personaje','hechizo','trampa','objeto','lugar'];
  let filter='todas', mazo='todos';
  const delMazo=lid=>{ const m={}; (DECKS[lid]?DECKS[lid].list:[]).forEach(([id,n])=>m[id]=n); return m; };
  const draw=()=>{
    const enMazo=(mazo==='todos'||mazo==='cajon')?null:delMazo(mazo), enElCajon=mazo==='cajon';
    const base=Object.keys(CARDS).filter(k=>!CARDS[k].token&&!CARDS[k].set).length;
    const cajon=Object.keys(CARDS).filter(k=>!CARDS[k].token&&CARDS[k].set==='cajon').length;
    p.innerHTML=enElCajon
      ? `<h3>🗄️ El Cajón</h3><p>${cajon} cartas nuevas, todavía fuera de los mazos.</p>`
      : `<h3>🃏 Cartas del set base</h3><p>${base} cartas + ${Object.keys(LEADERS).length} Líderes. Mantén pulsada una carta para verla en grande.</p>`;
    const fm=el('div','filters');
    const bt=el('button','btn sm'+(mazo==='todos'?' on':''),'Todos'); bt.onclick=()=>{mazo='todos';draw();}; fm.appendChild(bt);
    Object.keys(LEADERS).forEach(lid=>{ const b=el('button','btn sm'+(mazo===lid?' on':''),LEADERS[lid].art+' '+LEADERS[lid].n);
      b.onclick=()=>{mazo=lid;draw();}; fm.appendChild(b); });
    if(cajon){ const bc=el('button','btn sm'+(enElCajon?' on':''),'🗄️ Cajón'); bc.onclick=()=>{mazo='cajon';draw();}; fm.appendChild(bc); }
    p.appendChild(fm);
    const f=el('div','filters');
    types.forEach(t=>{ const b=el('button','btn sm'+(filter===t?' on':''),cap(t)); b.onclick=()=>{filter=t;draw();}; f.appendChild(b); });
    p.appendChild(f);
    const lista=Object.keys(CARDS).filter(k=>!CARDS[k].token&&(filter==='todas'||CARDS[k].t===filter)
      &&(enElCajon?CARDS[k].set==='cajon':!CARDS[k].set)&&(!enMazo||enMazo[k])).sort((a,b)=>CARDS[a].c-CARDS[b].c);
    if(enMazo){ const total=lista.reduce((n,k)=>n+enMazo[k],0);

    lista.forEach(k=>{ const c=cardEl(k,{}); if(enMazo&&enMazo[k]>1) c.appendChild(el('div','copias','×'+enMazo[k])); g.appendChild(c); });
    p.appendChild(g);
    requestAnimationFrame(()=>encajarTextos(g));
    if(!lista.length) p.appendChild(el('div','notagal','No hay cartas con ese filtro.'));
    const c=el('button','btn','Cerrar'); c.style.marginTop='14px'; c.style.width='100%'; c.onclick=cerrarOv; p.appendChild(c);
  };

}

/* ---------- el volado, la cortinilla y el arranque ---------- */
async function volado(nombreRival){
  const p=$('#ovPanel');
  const eleccion=await new Promise(ok=>{
    p.innerHTML=`<h3>🪙 Cara o cruz</h3><p>Elige tu lado. Quien gane el volado empieza la partida.</p>
      <div class="volado"><div class="moneda" id="moneda">👑</div>
        <div class="lados"><button class="btn gold" id="ladoCara">👑 CARA</button><button class="btn" id="ladoCruz">⚔️ CRUZ</button></div>
        <div class="dice" id="voladoTxt"></div></div>`;
    openOv();
    $('#ladoCara').onclick=()=>ok('cara'); $('#ladoCruz').onclick=()=>ok('cruz');
  });
  $('#ladoCara').disabled=$('#ladoCruz').disabled=true;
  $('#voladoTxt').innerHTML=`Pediste <b>${eleccion.toUpperCase()}</b>…`;
  const salio=rnd(2)===0?'cara':'cruz', moneda=$('#moneda');
  moneda.classList.add('girando');
  const alterna=setInterval(()=>{ moneda.textContent=moneda.textContent==='👑'?'⚔️':'👑'; },110);
  await nap(1500); clearInterval(alterna); moneda.classList.remove('girando');
  moneda.textContent=salio==='cara'?'👑':'⚔️';
  const ganas=salio===eleccion;
  $('#voladoTxt').innerHTML=`Salió <b>${salio.toUpperCase()}</b> ${salio==='cara'?'👑':'⚔️'} — `+(ganas?'<b>empiezas tú</b>':`empieza <b>${nombreRival}</b>`);
  await nap(1400); cerrarOv();
  return ganas?ME:FOE;
}

  ilustrarLider(d,lid); return d;

async function cortinillaVS(a,b,opts={}){
  if(opts.silent||opts.fast||opts.auto||opts.volado===false||opts.sinCortinilla||document.hidden) return;
  const capa=el('div','vs'); capa.innerHTML='<div class="vsfondo"></div><div class="vschispas"></div>';
  capa.appendChild(cartaDeLiderVS(a,'izq')); capa.appendChild(cartaDeLiderVS(b,'der')); capa.appendChild(el('div','vssello','VS'));
  document.body.appendChild(capa);
  await nap(60); capa.classList.add('entra'); await nap(620); capa.classList.add('choque'); await nap(2200);
  capa.classList.add('sale'); await nap(760); capa.remove();
}
async function startMatch(a,b,opts={}){
  const mia=++PARTIDA_N;
  tutEnd(); clearPrompt(); SEL=null; TGT=null; cerrarHojas();
  $('#log').innerHTML='';
  showScreen('board');
  const conVolado=opts.volado!==false;
  await cortinillaVS(a,b,opts);
  if(mia!==PARTIDA_N) return;
  const first=conVolado ? await volado(LEADERS[b].n) : (opts.first!=null?opts.first:null);

      if(TUT.i<k){ if(TUT.pending){ const r=TUT.pending; TUT.pending=null; r(); }

  p.deck=shuffle(p.deck.concat(p.hand)); p.hand=[];

  if(u.stunned>0) kw.push('<span class="kw bad">Aturdido</span>');
  if(u.infected) kw.push('<span class="kw bad">Infectado</span>');
  if(u.possessed) kw.push('<span class="kw bad">Poseído</span>');

function tutStart(){
  clearInterval(TUT.poll);
  if(TUT.pending) TUT.pending();
  document.body.classList.remove('tutpause');
  TUT={i:0,on:true,pending:null,bubble:0,foeTurn:0,data:null,poll:null,block:0,stepTurn:null,jugadas:null,endArgs:null,lider:TUT.lider};
  document.body.classList.add('tut-on');

  tutRender();
}
function tutRender(){
  if(!TUT.on){ $('#tut').classList.remove('on'); return; }
  const s=TUT_STEPS[TUT.i];
  if(!s){ tutEnd(); return; }
  $('#tut').classList.add('on');
  $('#tutStep').textContent=`${TUT.i+1}/${TUT_STEPS.length}`;
  const kind=$('#tutKind'), body=$('#tutBody'), wait=$('#tutWait'), next=$('#tutNext');
  const waiting=s.on&&!TUT.pending&&!(G&&G.over);
  const mustEnd=waiting&&G&&!G.over&&G.active===ME;
  TUT.hint=mustEnd;
  $('#tut').classList.toggle('watch', !!s.on);
  $('#tut').classList.toggle('todo', (!!s.wait&&!s.on)||mustEnd);
  if(waiting){
    kind.textContent=mustEnd?'🎯 TE TOCA':'👁 MIRA AL RIVAL';
    body.innerHTML=(s.wait_t||'<i>Observa. Te aviso en cuanto pase algo que merezca explicación.</i>')
      +(mustEnd?'<br><br><b>👉 Sigue tu turno y pulsa «Terminar turno»</b> para que Adreida juegue.':'');
    wait.textContent=mustEnd?'⏳ Te toca a ti':'⏳';
    next.style.display='none';
  } else {
    const texts=tutTexts(s);
    kind.textContent=s.on?'👁 MIRA AL RIVAL':(s.wait?'🎯 TE TOCA':'🎲 GERO EXPLICA');
    body.innerHTML=texts[TUT.bubble]; body.scrollTop=0;
    const more=TUT.bubble<texts.length-1, isTask=!more&&s.wait;
    wait.textContent=isTask?'⏳ Te toca a ti':'';
    next.style.display=isTask?'none':'';
    next.textContent=more?'Sigue →':(s.last?'¡A jugar! →':'Entendido →');
  }
  /* Arriba cuando el paso mira tu mano o tus controles; abajo cuando mira al
     rival. Y si no señala nada, arriba, que es donde menos tapa. */
  const abajo=!mustEnd&&(!!s.on||/foe|Foe|midRow/.test(s.hi||''));
  $('#tut').classList.toggle('abajo', abajo);
  tutHighlight();
  if(G) render();
}
const tutShow=tutRender;
function tutHighlight(){
  $$('.hi').forEach(e=>e.classList.remove('hi'));
  if(!TUT.on) return;
  const s=TUT_STEPS[TUT.i]; if(!s) return;
  if(s.on&&!TUT.pending){ if(TUT.hint){ const c=$('#controls'); if(c) c.classList.add('hi'); } return; }
  if(!s.hi) return;
  const t=$(s.hi); if(t) t.classList.add('hi');
}
function tutNext(){
  if(!TUT.on) return;
  const s=TUT_STEPS[TUT.i]; if(!s){ tutEnd(); return; }
  if(!(s.on&&!TUT.pending)&&TUT.bubble<tutTexts(s).length-1){ TUT.bubble++; tutRender(); return; }
  const resume=TUT.pending;
  TUT.pending=null; TUT.bubble=0; TUT.data=null; TUT.i++; TUT.block=0; TUT.stepTurn=null; TUT.jugadas=null;
  document.body.classList.remove('tutpause');
  if(s.last){ tutEnd(); } else tutRender();
  if(resume) resume();
}
async function tutBeat(kind,data){
  if(!TUT.on||TUT.pending||G.over) return;
  tutFlush();
  if(!TUT.on) return;
  const fits=c=>c&&c.on===kind&&(!c.when||c.when(G,data));
  let s=TUT_STEPS[TUT.i];
  if(!fits(s)){
    let j=-1;
    for(let k=TUT.i+1;k<Math.min(TUT_STEPS.length,TUT.i+4);k++){ const c=TUT_STEPS[k];
      if(c.wait&&!c.on&&!c.wait(G)) break;
      if(fits(c)){ j=k; break; } }
    if(j<0) return;
    TUT.i=j; s=TUT_STEPS[j];
  }
  TUT.data=data; TUT.bubble=0;
  document.body.classList.add('tutpause');
  cerrarHojas(); render();
  await new Promise(res=>{ TUT.pending=res; tutRender(); });
}
function tutEnd(){
  const pend=TUT.endArgs; TUT.endArgs=null;
  TUT.on=false; document.body.classList.remove('tut-on'); TUT.pending&&TUT.pending();

/* LA APP. El service worker (sw.js) guarda el juego para abrir sin red y
   desde la pantalla de inicio. Sólo en https y fuera de las pruebas, que
   necesitan leer siempre lo último del servidor. */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')
   && !new URLSearchParams(location.search).has('test')){
  addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
